name: abdiraman-yerasyl-student-api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: studentuser
      POSTGRES_PASSWORD: studentpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - student_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentuser -d studentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: abdiraman-yerasyl-student-api:v1.0-abdiraman-yerasyl
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: studentuser
      SPRING_DATASOURCE_PASSWORD: studentpass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student_network

volumes:
  postgres_data:

networks:
  student_network:
    driver: bridge
